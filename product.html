<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Cut &amp; Stitch Fashion Studio</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta name="description" content="View product details, sizing guide, and add to cart at Cut &amp; Stitch Fashion Studio.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

  <style>
    /* ── Page shell ─────────────────────────────────────── */
    .pd-wrap {
      padding-top: calc(var(--nav-h) + var(--sp-10));
      padding-bottom: var(--sp-20);
      min-height: 100vh;
      background: var(--c-pearl);
    }

    /* ── Breadcrumb ──────────────────────────────────────── */
    .breadcrumb {
      font-size: var(--fs-sm);
      color: var(--c-text-muted);
      margin-bottom: var(--sp-8);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }
    .breadcrumb a { color: var(--c-primary); text-decoration: none; }
    .breadcrumb a:hover { color: var(--c-gold); }
    .breadcrumb span { color: var(--c-text-muted); }

    /* ── Main grid ───────────────────────────────────────── */
    .pd-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-12);
    }
    @media(min-width: 768px) {
      .pd-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Image gallery ───────────────────────────────────── */
    .gallery { display: flex; flex-direction: column; gap: var(--sp-3); }
    .gallery-main {
      position: relative;
      border-radius: var(--r-xl);
      overflow: hidden;
      background: var(--c-white);
      aspect-ratio: 3/4;
      box-shadow: var(--sh-lg);
    }
    .gallery-main img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s var(--ease);
    }
    .gallery-main:hover img { transform: scale(1.04); }
    .gallery-thumbs {
      display: flex;
      gap: var(--sp-2);
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .gallery-thumb {
      width: 72px; height: 90px;
      flex-shrink: 0;
      border-radius: var(--r-md);
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color var(--dur-fast), transform var(--dur-fast);
      background: var(--c-white);
    }
    .gallery-thumb:hover { transform: translateY(-2px); border-color: var(--c-gold); }
    .gallery-thumb.active { border-color: var(--c-primary); }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Discount ribbon */
    .discount-ribbon {
      position: absolute;
      top: var(--sp-4); left: var(--sp-4);
      background: var(--c-gold);
      color: var(--c-white);
      font-weight: var(--fw-bold);
      font-size: var(--fs-sm);
      padding: var(--sp-1) var(--sp-3);
      border-radius: var(--r-full);
      z-index: 3;
    }

    /* ── Info panel ──────────────────────────────────────── */
    .pd-info { display: flex; flex-direction: column; gap: var(--sp-5); }

    .pd-category {
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--c-gold-dark);
    }
    .pd-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: var(--fw-bold);
      color: var(--c-primary);
      line-height: 1.2;
      margin: 0;
    }
    .pd-stars { color: var(--c-gold); font-size: var(--fs-lg); letter-spacing: 2px; }
    .pd-price-row { display: flex; align-items: baseline; gap: var(--sp-3); }
    .pd-price {
      font-size: 1.8rem;
      font-weight: var(--fw-bold);
      color: var(--c-primary);
    }
    .pd-orig-price {
      font-size: 1.1rem;
      color: var(--c-text-muted);
      text-decoration: line-through;
    }
    .pd-save {
      font-size: var(--fs-sm);
      background: #FEF3C7;
      color: #92400E;
      padding: 2px 8px;
      border-radius: var(--r-full);
      font-weight: var(--fw-semibold);
    }

    .pd-offer-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: var(--sp-2) var(--sp-4);
      border-radius: var(--r-full);
      font-size: var(--fs-sm);
      font-weight: var(--fw-semibold);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    .pd-desc {
      color: var(--c-text);
      line-height: 1.8;
      font-size: var(--fs-base);
    }

    .pd-divider {
      height: 1px;
      background: var(--c-border);
      margin: var(--sp-2) 0;
    }

    /* ── Size selector ───────────────────────────────────── */
    .size-label {
      font-weight: var(--fw-semibold);
      color: var(--c-primary);
      font-size: var(--fs-sm);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: var(--sp-2);
      display: block;
    }
    .size-btns { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .size-btn {
      padding: var(--sp-2) var(--sp-5);
      border: 2px solid var(--c-border);
      border-radius: var(--r-full);
      background: var(--c-white);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      cursor: pointer;
      transition: all var(--dur-fast);
      color: var(--c-text);
    }
    .size-btn:hover { border-color: var(--c-primary); color: var(--c-primary); }
    .size-btn.active {
      background: var(--c-primary);
      border-color: var(--c-primary);
      color: var(--c-white);
    }
    .size-btn.no-data {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
    .size-custom-btn {
      padding: var(--sp-2) var(--sp-4);
      border: 2px dashed var(--c-gold);
      border-radius: var(--r-full);
      background: transparent;
      color: var(--c-gold-dark);
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      cursor: pointer;
      transition: all var(--dur-fast);
    }
    .size-custom-btn:hover, .size-custom-btn.active {
      background: var(--c-gold);
      color: var(--c-white);
      border-style: solid;
    }

    /* ── Size Chart table ────────────────────────────────── */
    .size-chart-wrap {
      background: var(--c-white);
      border-radius: var(--r-lg);
      border: 1px solid var(--c-border);
      overflow: hidden;
    }
    .size-chart-header {
      padding: var(--sp-4) var(--sp-5);
      background: var(--c-primary);
      color: white;
      font-weight: var(--fw-semibold);
      font-size: var(--fs-sm);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .size-chart-header svg { transition: transform var(--dur-fast); }
    .size-chart-header.open svg { transform: rotate(180deg); }
    .size-chart-body {
      display: none;
      padding: var(--sp-5);
    }
    .size-chart-body.open { display: block; }
    .size-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--fs-sm);
    }
    .size-table th {
      background: var(--c-pearl);
      color: var(--c-primary);
      font-weight: var(--fw-bold);
      padding: var(--sp-3) var(--sp-4);
      text-align: left;
      border-bottom: 2px solid var(--c-border);
    }
    .size-table td {
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--c-border);
      color: var(--c-text);
    }
    .size-table tr:last-child td { border-bottom: none; }
    .size-table tr:hover td { background: var(--c-pearl); }

    /* ── CTA buttons ─────────────────────────────────────── */
    .pd-cta { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
    .pd-cta .btn { flex: 1; min-width: 140px; justify-content: center; }

    /* ── Skeleton loader ─────────────────────────────────── */
    .skeleton { background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--r-md); }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-img { width: 100%; aspect-ratio: 3/4; border-radius: var(--r-xl); }
    .skel-line { height: 16px; margin-bottom: var(--sp-3); }
    .skel-line.w-40 { width: 40%; }
    .skel-line.w-60 { width: 60%; }
    .skel-line.w-80 { width: 80%; }
    .skel-line.h-32 { height: 32px; }

    /* ── Error/Not found ─────────────────────────────────── */
    .pd-error {
      text-align: center;
      padding: var(--sp-20) 0;
    }
    .pd-error h2 { color: var(--c-primary); margin-bottom: var(--sp-4); }
    .pd-error p { color: var(--c-text-muted); margin-bottom: var(--sp-8); }
  </style>
</head>

  <script>
    // ── Helpers ────────────────────────────────────────────
    function starsHTML(n) {
      return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function formatPrice(p) {
      return 'Rs. ' + Number(p).toLocaleString('en-PK');
    }

    function categoryLabel(cat) {
      return { men: 'Men', women: 'Women', kids: 'Kids' }[cat] || cat;
    }

    function categoryBadgeClass(cat) {
      return { men: 'badge--blue', women: 'badge--gold', kids: 'badge--green' }[cat] || 'badge--gold';
    }

    // Parse size measurements string into rows for the table
    // Expected format: "Chest: 36\", Waist: 30\", Length: 52\""
    function parseSizeMeasurements(str) {
      if (!str) return [];
      return str.split(',').map(s => {
        const parts = s.trim().split(':');
        if (parts.length >= 2) return { key: parts[0].trim(), val: parts.slice(1).join(':').trim() };
        return { key: s.trim(), val: '' };
      }).filter(r => r.key);
    }

    // ── Selected state ─────────────────────────────────────
    let currentProduct = null;
    let selectedSize   = 'M';

    // ── Gallery swap ───────────────────────────────────────
    function selectThumb(idx) {
      const mainImg = document.getElementById('pdMainImg');
      if (!mainImg || !currentProduct) return;
      mainImg.src = currentProduct.images[idx];
      document.querySelectorAll('.gallery-thumb').forEach((t, i) => {
        t.classList.toggle('active', i === idx);
      });
    }

    // ── Size selection ─────────────────────────────────────
    function selectSize(size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn, .size-custom-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.size === size);
      });
    }

    // ── Size chart toggle ──────────────────────────────────
    function toggleSizeChart() {
      const header = document.getElementById('sizeChartHeader');
      const body   = document.getElementById('sizeChartBody');
      header.classList.toggle('open');
      body.classList.toggle('open');
    }

    // ── Render product ─────────────────────────────────────
    function renderProduct(p) {
      currentProduct = p;
      selectedSize   = p.sizes.M ? 'M' : (p.sizes.S ? 'S' : 'L');

      // Update page title and breadcrumb
      document.title = `${p.name} | Cut & Stitch Fashion Studio`;
      document.getElementById('pdBreadcrumbName').textContent = p.name;

      // Build gallery thumbs
      const thumbsHTML = p.images.map((img, i) => `
        <div class="gallery-thumb ${i === 0 ? 'active' : ''}" onclick="selectThumb(${i})">
          <img src="${img}" alt="${p.name} view ${i+1}" loading="lazy">
        </div>`).join('');

      // Build size buttons
      const sizeKeys = ['S', 'M', 'L'];
      const sizeBtnsHTML = sizeKeys.map(s => `
        <button class="size-btn ${s === selectedSize ? 'active' : ''} ${!p.sizes[s] ? 'no-data' : ''}"
          data-size="${s}" onclick="selectSize('${s}')">${s}</button>`).join('');

      // Build size chart rows
      const hasSizeData = Object.values(p.sizes).some(Boolean);
      const sizeTableHTML = hasSizeData ? `
        <div class="size-chart-wrap">
          <div class="size-chart-header" id="sizeChartHeader" onclick="toggleSizeChart()">
            <span>📏 Size Guide & Measurements</span>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
          <div class="size-chart-body" id="sizeChartBody">
            <table class="size-table">
              <thead><tr><th>Measurement</th><th>Size S</th><th>Size M</th><th>Size L</th></tr></thead>
              <tbody>
                ${buildSizeTableRows(p.sizes)}
              </tbody>
            </table>
          </div>
        </div>` : '';

      // Discount + offer
      const discountBadge = p.discountPct > 0
        ? `<span class="discount-ribbon">-${p.discountPct}%</span>` : '';
      const origPriceHTML = p.origPrice > p.price
        ? `<span class="pd-orig-price">${formatPrice(p.origPrice)}</span>
           <span class="pd-save">Save ${p.discountPct}%</span>` : '';
      const offerHTML = p.offerText
        ? `<div><span class="pd-offer-badge">🔥 ${p.offerText}</span></div>` : '';

      const html = `
        <div class="pd-grid reveal reveal-up">
          <!-- Gallery -->
          <div class="gallery">
            <div class="gallery-main">
              ${discountBadge}
              <img id="pdMainImg" src="${p.images[0]}" alt="${p.name}">
            </div>
            ${p.images.length > 1 ? `<div class="gallery-thumbs">${thumbsHTML}</div>` : ''}
          </div>

          <!-- Info -->
          <div class="pd-info">
            <div>
              <div class="pd-category">${categoryLabel(p.category)} · ${p.subCat || 'Collection'}</div>
              <h1 class="pd-name">${p.name}</h1>
            </div>

            <div class="pd-stars">${starsHTML(p.stars)}</div>

            ${offerHTML}

            <div>
              <div class="pd-price-row">
                <span class="pd-price">${formatPrice(p.price)}</span>
                ${origPriceHTML}
              </div>
            </div>

            <div class="pd-divider"></div>

            <p class="pd-desc">${p.fullDesc || p.shortDesc || 'No description available.'}</p>

            <div class="pd-divider"></div>

            <!-- Size selector -->
            <div>
              <span class="size-label">Select Size</span>
              <div class="size-btns">
                ${sizeBtnsHTML}
                <button class="size-custom-btn ${selectedSize === 'Custom' ? 'active' : ''}"
                  data-size="Custom" onclick="selectSize('Custom')">✂ Custom</button>
              </div>
            </div>

            ${sizeTableHTML}

            <!-- CTA -->
            <div class="pd-cta">
              <button class="btn btn-primary" id="pdAddToCartBtn" onclick="pdAddToCart()">
                🛍 Add to Cart
              </button>
              <button class="btn btn-gold" id="pdBuyNowBtn" onclick="pdBuyNow()">
                ⚡ Buy Now
              </button>
            </div>

            <!-- WhatsApp sizing help -->
            <a id="pdWhatsappLink" href="#"
               target="_blank"
               style="display:inline-flex;align-items:center;gap:8px;color:#25D366;font-size:var(--fs-sm);font-weight:var(--fw-semibold);text-decoration:none;">

              Questions about sizing? Chat on WhatsApp
            </a>
          </div>
        </div>`;

      document.getElementById('pdContent').innerHTML = html;

      // Set WhatsApp link with live product URL
      const productUrl = window.location.origin + '/product.html?id=' + p.id;
      const waMsg = encodeURIComponent(
        'Hi! I am interested in this product:\n\n' +
        '📦 *' + p.name + '*\n' +
        '💰 Price: Rs. ' + Number(p.price).toLocaleString('en-PK') + '\n' +
        '🔗 Link: ' + productUrl + '\n\n' +
        'Please help me with sizing and availability.'
      );
      const waLink = document.getElementById('pdWhatsappLink');
      if (waLink) waLink.href = 'https://wa.me/923106845085?text=' + waMsg;

      // Trigger reveal animations
      setTimeout(() => {
        document.querySelectorAll('.reveal').forEach(el => el.classList.add('revealed'));
      }, 100);
    }

    // Build size table rows by merging all measurement keys across S/M/L
    function buildSizeTableRows(sizes) {
      const sData = {
        S: parseSizeMeasurements(sizes.S),
        M: parseSizeMeasurements(sizes.M),
        L: parseSizeMeasurements(sizes.L)
      };
      // Collect all unique measurement keys (in order found)
      const allKeys = [];
      ['S','M','L'].forEach(sz => sData[sz].forEach(r => { if(!allKeys.includes(r.key)) allKeys.push(r.key); }));
      if (!allKeys.length) return '<tr><td colspan="4" style="text-align:center;color:var(--c-text-muted);">Measurements not specified. Contact us on WhatsApp for sizing help.</td></tr>';

      return allKeys.map(key => {
        const getVal = sz => (sData[sz].find(r => r.key === key) || {}).val || '—';
        return `<tr>
          <td><strong>${key}</strong></td>
          <td>${getVal('S')}</td>
          <td>${getVal('M')}</td>
          <td>${getVal('L')}</td>
        </tr>`;
      }).join('');
    }

    // ── Cart actions ───────────────────────────────────────
    function pdAddToCart() {
      if (!currentProduct) return;
      Cart.addItem({
        title:    currentProduct.name,
        price:    'Rs. ' + Number(currentProduct.price).toLocaleString('en-PK'),
        category: categoryLabel(currentProduct.category),
        image:    currentProduct.images[0],
        size:     selectedSize
      });
    }

    function pdBuyNow() {
      if (!currentProduct) return;
      if (typeof Auth !== 'undefined' && Auth.currentUser && !Auth.currentUser.isVerified) {
        Auth.showVerificationModal();
        return;
      }
      pdAddToCart();
      window.location.href = 'checkout.html';
    }

    // ── Initialise ─────────────────────────────────────────
    async function initProductPage() {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        document.getElementById('pdContent').innerHTML = `
          <div class="pd-error">
            <h2>No Product Selected</h2>
            <p>Please browse our collections and select a product.</p>
            <a href="catalog.html" class="btn btn-primary">Browse Collections</a>
          </div>`;
        document.getElementById('pdBreadcrumbName').textContent = 'Not Found';
        return;
      }

      try {
        const res  = await fetch('/api/products');
        const data = await res.json();
        const product = (data.products || []).find(p => p.id === productId);

        if (!product) {
          document.getElementById('pdContent').innerHTML = `
            <div class="pd-error">
              <h2>Product Not Found</h2>
              <p>This product may have been sold out or removed. Browse our latest collection below.</p>
              <a href="catalog.html" class="btn btn-primary">Browse Collections</a>
            </div>`;
          document.getElementById('pdBreadcrumbName').textContent = 'Not Found';
          return;
        }

        renderProduct(product);

      } catch (err) {
        console.error('Failed to load product:', err);
        document.getElementById('pdContent').innerHTML = `
          <div class="pd-error">
            <h2>Failed to Load Product</h2>
            <p>Please check your connection and try again.</p>
            <a href="catalog.html" class="btn btn-primary">Back to Collections</a>
          </div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', initProductPage);
  </script>
